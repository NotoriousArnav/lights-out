<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Offline · Lights Out</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f1ea;
        --card: #fff;
        --text: #1f2430;
        --muted: #6b7280;
        --off: #dcd7cb;
        --on: #f5a623;
        --accent: #2f5bea;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161c;
          --card: #1e222b;
          --text: #eceff4;
          --muted: #9aa3b2;
          --off: #2c313d;
          --on: #ffc14d;
          --accent: #7c9bff;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      .offline__grid {
        display: grid;
        grid-template-columns: repeat(3, 34px);
        gap: 6px;
        justify-content: center;
        margin-bottom: 24px;
      }

      .offline__grid span {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--off);
      }

      .offline__grid span.on {
        background: var(--on);
        box-shadow: 0 0 12px color-mix(in srgb, var(--on) 55%, transparent);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }

      p {
        margin: 0 0 10px;
        color: var(--muted);
        line-height: 1.5;
      }

      button {
        margin-top: 10px;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="offline__grid" aria-hidden="true">
        <span class="on"></span>
        <span></span>
        <span class="on"></span>
        <span></span>
        <span class="on"></span>
        <span></span>
        <span class="on"></span>
        <span></span>
        <span class="on"></span>
      </div>
      <h1>You're offline</h1>
      <p>Reconnect to start a new puzzle or post a score.</p>
      <p>This installed app will be ready when you're back online.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
