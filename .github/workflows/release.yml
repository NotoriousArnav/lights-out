name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      android_version_code: ${{ steps.meta.outputs.android_version_code }}
    steps:
      - id: meta
        name: Resolve version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "android_version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version}."

  web:
    name: Web bundle
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Validate PWA manifest
        run: node scripts/validate-pwa.mjs

      - name: Package web bundle
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/lights-out-server-${VERSION}.tar.gz" -C .output .

      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release-assets/*
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-15-intel
            target: --mac --x64
          - name: macos-arm64
            os: macos-15
            target: --mac --arm64
          - name: windows-x64
            os: windows-latest
            target: --win --x64
          - name: windows-arm64
            os: windows-11-arm
            target: --win --arm64
          - name: linux-x64
            os: ubuntu-24.04
            target: --linux --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: --linux --arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('native/desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install desktop dependencies
        shell: bash
        run: npm ci --prefix native/desktop

      - name: Set desktop version
        shell: bash
        working-directory: native/desktop
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Build desktop artifact
        working-directory: native/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.name }}
          path: |
            native/desktop/release/*.dmg
            native/desktop/release/*.zip
            native/desktop/release/*.exe
            native/desktop/release/*.AppImage
            native/desktop/release/*.tar.gz
          if-no-files-found: error

  android:
    name: Android (TWA)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('native/android/**/*.gradle*', 'native/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Select Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using the release keystore from repository secrets."
          else
            {
              echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/native/android/debug.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=android"
              echo "ANDROID_KEY_ALIAS=androiddebugkey"
              echo "ANDROID_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "::warning::No Android release keystore configured; signing with the checked-in debug key."
          fi

      - name: Build Android artifacts
        working-directory: native/android
        shell: bash
        env:
          ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
          ANDROID_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
          find app/build/outputs -maxdepth 5 -type f -print

      - name: Package Android artifacts
        working-directory: native/android
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "release/lights-out-${VERSION}-$(basename "$apk")"
          done
          for aab in app/build/outputs/bundle/release/*.aab; do
            cp "$aab" "release/lights-out-${VERSION}-$(basename "$aab")"
          done
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: native/android/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, web, desktop, android]
    if: ${{ always() && !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Inspect release artifacts
        shell: bash
        run: |
          count=$(find release-assets -type f ! -name SHA256SUMS | wc -l)
          echo "Publishing ${count} artifact(s)."
          first_artifact=$(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.apk' -o -name '*.aab' \) -print -quit)
          if [ -z "$first_artifact" ]; then
            echo "::error::No desktop or Android artifacts were built."
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.tmp
          mv ../SHA256SUMS.tmp SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Lights Out ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          files: release-assets/*
          fail_on_unmatched_files: true
