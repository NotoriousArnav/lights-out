name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      desktop: ${{ steps.detect.outputs.desktop }}
      android: ${{ steps.detect.outputs.android }}
      android_dir: ${{ steps.detect.outputs.android_dir }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - id: detect
        name: Detect native projects
        shell: bash
        run: |
          if [ -f native/desktop/package.json ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f native/android/gradlew ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "android_dir=native/android" >> "$GITHUB_OUTPUT"
          elif [ -f native/android/android/gradlew ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "android_dir=native/android/android" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "android_dir=" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web bundle
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package web bundle
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-assets
          tar -czf "release-assets/lights-out-server-${VERSION}.tar.gz" -C .output .

      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release-assets/*
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-15-intel
            target: --mac --x64
          - name: macos-arm64
            os: macos-15
            target: --mac --arm64
          - name: windows-x64
            os: windows-latest
            target: --win --x64
          - name: windows-arm64
            os: windows-11-arm
            target: --win --arm64
          - name: linux-x64
            os: ubuntu-24.04
            target: --linux --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: --linux --arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('native/desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install desktop dependencies
        shell: bash
        run: |
          if [ -f native/desktop/package-lock.json ]; then
            npm ci --prefix native/desktop
          else
            npm install --prefix native/desktop
          fi

      - name: Build desktop artifact
        working-directory: native/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.name }}
          path: native/desktop/release/**
          if-no-files-found: error

  android:
    name: Android
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android shell dependencies
        shell: bash
        run: |
          if [ -f native/android/package.json ]; then
            if [ -f native/android/package-lock.json ]; then
              npm ci --prefix native/android
            else
              npm install --prefix native/android
            fi
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('native/android/**/*.gradle*', 'native/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No Android keystore secret configured; building unsigned."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build Android artifacts
        working-directory: ${{ needs.prepare.outputs.android_dir }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            ${{ needs.prepare.outputs.android_dir }}/app/build/outputs/apk/release/*.apk
            ${{ needs.prepare.outputs.android_dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, web, desktop, android]
    if: ${{ always() && !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Inspect release artifacts
        shell: bash
        run: |
          count=$(find release-assets -type f ! -name SHA256SUMS | wc -l)
          echo "Publishing ${count} artifact(s)."
          if ! find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.apk' -o -name '*.aab' \) | grep -q .; then
            echo "::warning::No desktop or Android artifacts were built. Add native/desktop and native/android projects to enable those jobs."
          fi

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lights Out ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: true
